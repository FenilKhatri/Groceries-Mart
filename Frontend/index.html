<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.webp" />

    <!-- Preload Hero Images -->
    <link
      rel="preload"
      as="image"
      href="/assets/HeroImgMobile.webp"
      media="(max-width: 768px)"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/HeroImgDesktop.webp"
      media="(min-width: 769px)"
    />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="3HQqGJWM-05Gd2MRjPQONUxDzRSfQQRR2AS8ZxFM9OM"
    />

    <!-- PRIMARY SEO -->
    <title>
      FreshMart – Online Grocery Store | Fresh Vegetables, Fruits & Daily Essentials
    </title>

    <meta
      name="description"
      content="FreshMart is your trusted online grocery store. Buy fresh vegetables, fruits, dairy, bakery items and daily essentials with fast delivery, secure Razorpay payments and best prices."
    />

    <meta name="author" content="FreshMart" />
    <meta name="robots" content="index,follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://groceries-mart.vercel.app/" />

    <!-- OPEN GRAPH (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://groceries-mart.vercel.app/" />
    <meta property="og:title" content="FreshMart – Online Grocery Store" />
    <meta
      property="og:description"
      content="Buy fresh vegetables, fruits, dairy and daily essentials online with fast delivery and secure checkout."
    />

    <!-- IMPORTANT: Use a real 1200x630 image -->
    <meta
      property="og:image"
      content="https://groceries-mart.vercel.app/preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://groceries-mart.vercel.app/" />
    <meta name="twitter:title" content="FreshMart – Buy Groceries Online" />
    <meta
      name="twitter:description"
      content="Shop fresh groceries with fast delivery and secure payment."
    />
    <meta
      name="twitter:image"
      content="https://groceries-mart.vercel.app/preview.png"
    />

    <!-- STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GroceryStore",
        "name": "FreshMart",
        "url": "https://groceries-mart.vercel.app/",
        "image": "https://groceries-mart.vercel.app/logo.webp",
        "description": "Online grocery store for fresh vegetables, fruits, dairy and daily essentials with fast delivery."
      }
    </script>

    <!-- GOOGLE ANALYTICS -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-E5ZXTXSJP3"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-E5ZXTXSJP3");
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
